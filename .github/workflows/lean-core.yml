name: Lean 4 and RDF interoperability contracts

on:
  push:
    paths:
      - "verification/lean/**"
      - ".github/workflows/lean-core.yml"
      - "tests/test_om_bridge.py"
      - "verification/om_measure_shapes.ttl"
      - "src/taco_rdf/nice_food.py"
  pull_request:
    paths:
      - "verification/lean/**"
      - ".github/workflows/lean-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain using elan
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check core numerical rules and review-resolution proofs
        working-directory: verification/lean
        run: |
          lean --version
          lean TacoRules.lean
          lean TypeReviewApplication.lean
          lean UnitBridgeProof.lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RDF bridge test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify the full TACO QUDT to OM export and SHACL contract
        run: pytest -q tests/test_om_bridge.py
      - name: Disallow admitted proofs in core files
        working-directory: verification/lean
        run: |
          if grep -nE '\b(sorry|admit)\b' TacoRules.lean TypeReviewApplication.lean UnitBridgeProof.lean; then
            echo 'Core Lean source contains an admitted proof' >&2
            exit 1
          fi
