<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 190" width="1080" height="190" role="img" aria-label="How TACO and NEVO values were compared"><style>
.n{fill:#ffffff;stroke:#c9d3d0;stroke-width:1.2}.k{fill:#e0f0ec;stroke:#0b6e63;stroke-width:1.4}
.t{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#17201e}.s{font:400 11px Consolas,'Courier New',monospace;fill:#56635f}
.l{font:400 11px 'Segoe UI',Arial,sans-serif;fill:#56635f}.lk{font:600 11px 'Segoe UI',Arial,sans-serif;fill:#0b6e63}
.h{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#56635f;letter-spacing:.06em}
.e{stroke:#17201e;stroke-width:1.3;fill:none}.ek{stroke:#0b6e63;stroke-width:2;fill:none}.d{stroke-dasharray:6 4}
.m{fill:#17201e}.mk{fill:#0b6e63}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/><rect class="k" x="20" y="20" width="225" height="150" rx="5"/><text class="t" x="36" y="48">1. Pair foods</text><text class="lk" x="36" y="68">same FoodOn class</text><text class="l" x="36" y="98">115 food pairs</text><text class="l" x="36" y="116">83 shared FoodOn classes</text><text class="l" x="36" y="134">+257 pairs one step apart</text><text class="l" x="36" y="152">in FoodOn's hierarchy</text><line class="e" x1="247" y1="95" x2="283" y2="95" marker-end="url(#a)"/><rect class="k" x="285" y="20" width="225" height="150" rx="5"/><text class="t" x="301" y="48">2. Pair values</text><text class="lk" x="301" y="68">same CDNO class and unit</text><text class="l" x="301" y="98">2,294 value pairs</text><text class="l" x="301" y="116">33 CDNO classes</text><text class="l" x="301" y="134">available carbohydrate:</text><text class="l" x="301" y="152">TACO total − fibre vs NEVO</text><line class="e" x1="512" y1="95" x2="548" y2="95" marker-end="url(#a)"/><rect class="n" x="550" y="20" width="225" height="150" rx="5"/><text class="t" x="566" y="48">3. One value per food</text><text class="lk" x="566" y="68">median of its NEVO foods</text><text class="l" x="566" y="98">each TACO food counts</text><text class="l" x="566" y="116">once, however broad</text><text class="l" x="566" y="134">its FoodOn class</text><line class="e" x1="777" y1="95" x2="813" y2="95" marker-end="url(#a)"/><rect class="n" x="815" y="20" width="225" height="150" rx="5"/><text class="t" x="831" y="48">4. Agreement</text><text class="lk" x="831" y="68">rank, ratio, bands</text><text class="l" x="831" y="98">Spearman's rho, TACO/NEVO</text><text class="l" x="831" y="116">ratio, within 20 %</text><text class="l" x="831" y="134">protein: rho 0.94,</text><text class="l" x="831" y="152">median ratio 0.95</text></svg>