<rect width="100%" height="100%" fill="#ffffff"/><rect class="n" x="20" y="30" width="160" height="56" rx="5"/><text class="t" x="100.0" y="54.0" text-anchor="middle">Source table</text><text class="s" x="100.0" y="72.0" text-anchor="middle">TACO or NEVO page</text><rect class="n" x="300" y="30" width="180" height="56" rx="5"/><text class="t" x="390.0" y="54.0" text-anchor="middle">Food item</text><text class="s" x="390.0" y="72.0" text-anchor="middle">fio:FoodItem</text><rect class="k" x="600" y="30" width="180" height="56" rx="5"/><text class="t" x="690.0" y="54.0" text-anchor="middle">FoodOn class</text><text class="s" x="690.0" y="72.0" text-anchor="middle">FOODON_00005279</text><rect class="n" x="900" y="30" width="160" height="56" rx="5"/><text class="t" x="980.0" y="54.0" text-anchor="middle">FoodOn superclass</text><text class="s" x="980.0" y="72.0" text-anchor="middle">FOODON_00002761</text><line class="e" x1="300" y1="58" x2="183" y2="58" marker-end="url(#a)"/><text class="l" x="241" y="50" text-anchor="middle">dcterms:isVersionOf</text><line class="ek" x1="480" y1="58" x2="597" y2="58" marker-end="url(#ak)"/><text class="lk" x="539" y="50" text-anchor="middle">rdf:type</text><line class="e" x1="780" y1="58" x2="897" y2="58" marker-end="url(#a)"/><text class="l" x="839" y="50" text-anchor="middle">rdfs:subClassOf</text><text class="lk" x="690" y="104" text-anchor="middle">pairs foods across tables</text><line class="e" x1="390" y1="86" x2="390" y2="167" marker-end="url(#a)"/><text class="l" x="398" y="131" text-anchor="start">fio:hasNutritionalValue</text><rect class="n" x="20" y="170" width="160" height="56" rx="5"/><text class="t" x="100.0" y="194.0" text-anchor="middle">Nutrient code</text><text class="s" x="100.0" y="212.0" text-anchor="middle">nevonut:PROT</text><rect class="n" x="300" y="170" width="180" height="56" rx="5"/><text class="t" x="390.0" y="194.0" text-anchor="middle">Nutritional value</text><text class="s" x="390.0" y="212.0" text-anchor="middle">fio:NutritionalValue</text><rect class="k" x="600" y="170" width="180" height="56" rx="5"/><text class="t" x="690.0" y="194.0" text-anchor="middle">CDNO class</text><text class="s" x="690.0" y="212.0" text-anchor="middle">CDNO_0200040</text><rect class="n" x="900" y="170" width="160" height="56" rx="5"/><text class="t" x="980.0" y="194.0" text-anchor="middle">CDNO superclass</text><text class="s" x="980.0" y="212.0" text-anchor="middle">CDNO_0200001</text><line class="e" x1="300" y1="198" x2="183" y2="198" marker-end="url(#a)"/><text class="l" x="241" y="190" text-anchor="middle">fio:hasNutrient</text><line class="ek" x1="480" y1="198" x2="597" y2="198" marker-end="url(#ak)"/><text class="lk" x="539" y="190" text-anchor="middle">rdf:type</text><line class="e" x1="780" y1="198" x2="897" y2="198" marker-end="url(#a)"/><text class="l" x="839" y="190" text-anchor="middle">rdfs:subClassOf</text><text class="lk" x="690" y="244" text-anchor="middle">pairs values across tables</text><line class="e" x1="390" y1="226" x2="390" y2="307" marker-end="url(#a)"/><text class="l" x="398" y="271" text-anchor="start">om:hasValue</text><line class="e d" x1="300" y1="220" x2="184" y2="309" marker-end="url(#a)"/><text class="l" x="208" y="258" text-anchor="end">taco:valueStatus,</text><text class="l" x="208" y="271" text-anchor="end">instead of a measure</text><rect class="n" x="20" y="310" width="160" height="56" rx="5"/><text class="t" x="100.0" y="334.0" text-anchor="middle">Trace, not applicable</text><text class="s" x="100.0" y="352.0" text-anchor="middle">no number, no zero</text><rect class="n" x="300" y="310" width="180" height="56" rx="5"/><text class="t" x="390.0" y="334.0" text-anchor="middle">Measure</text><text class="s" x="390.0" y="352.0" text-anchor="middle">om:Measure</text><rect class="n" x="600" y="310" width="180" height="56" rx="5"/><text class="t" x="690.0" y="334.0" text-anchor="middle">22.17 g per 100 g</text><text class="s" x="690.0" y="352.0" text-anchor="middle">om:gramPerHectogram</text><line class="e" x1="480" y1="338" x2="597" y2="338" marker-end="url(#a)"/><text class="l" x="539" y="318" text-anchor="middle">om:hasNumericalValue</text><text class="l" x="539" y="330" text-anchor="middle">om:hasUnit</text></svg>